[project]
name = "aeromind-api"
version = "0.1.0"
description = ""
authors = [
  { name = "Jacobo Blandón Castro", email = "jacoboblandon94@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["phonenumbers (>=9.0.30,<10.0.0)", "fastapi (>=0.136.1,<0.137.0)", "uvicorn (>=0.46.0,<0.47.0)", "pycountry (>=26.2.16,<27.0.0)", "sqlalchemy (>=2.0.49,<3.0.0)", "alembic (>=1.18.4,<2.0.0)", "asyncpg (>=0.31.0,<0.32.0)", "bcrypt (>=5.0.0,<6.0.0)", "pydantic-settings (>=2.14.1,<3.0.0)", "python-jose[cryptography] (>=3.5.0,<4.0.0)", "greenlet (>=3.2.3,<4.0.0)", "mcp (>=1.0.0,<2.0.0)", "pgvector (>=0.3.0,<0.4.0)", "google-genai (>=1.0.0,<2.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "ruff (>=0.15.12,<0.16.0)",
  "mypy (>=2.1.0,<3.0.0)",
  "pytest-cov (>=7.1.0,<8.0.0)",
  "httpx (>=0.28.1,<0.29.0)",
  "types-python-jose (>=3.5.0.20260408,<4.0.0.0)",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
files = ["app"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
